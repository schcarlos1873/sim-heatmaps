[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rand = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }

[package]
name = "sim-heatmaps"
version.workspace = true
edition.workspace = true
description = "Simulador de scanner QCS e visualizador de Contour Map"

[lib]
name = "sim_heatmaps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
domain.workspace = true
application.workspace = true
infrastructure.workspace = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
